{% extends "base.html" %}

{% block title %}{{ _("Register — AutoDrop") }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 p-8 bg-slate-950 border border-slate-800 rounded-2xl shadow-xl">
    <div class="text-center space-y-2 mb-8">
        <h1 class="text-2xl font-bold text-white tracking-tight">{{ _("Create Account") }}</h1>
        <p class="text-sm text-slate-400">{{ _("Register for AutoDrop dropshipping engine access.") }}</p>
    </div>

    <form method="post" action="/auth/register" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="first_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("First Name") }} *</label>
                <input type="text" id="first_name" name="first_name" value="{{ first_name or '' }}" required autofocus
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
            </div>
            <div>
                <label for="last_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Last Name") }} *</label>
                <input type="text" id="last_name" name="last_name" value="{{ last_name or '' }}" required
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
            </div>
        </div>

        <div>
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Email Address") }} *</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <div>
            <label for="phone" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Phone Number") }}</label>
            <input type="tel" id="phone" name="phone" value="{{ phone or '' }}" placeholder="+36 30 123 4567"
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <div>
            <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Password (min. 8 characters)") }} *</label>
            <input type="password" id="password" name="password" minlength="8" required
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <button type="submit" class="w-full py-3 mt-4 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
            <span>📝</span>
            <span>{{ _("Register Account") }}</span>
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
        <p class="text-sm text-slate-400">
            {{ _("Already have an account?") }}
            <a href="/auth/login" class="text-emerald-400 hover:text-emerald-300 font-semibold ml-1 transition">{{ _("Sign In") }}</a>
        </p>
    </div>
</div>
{% endblock %}
