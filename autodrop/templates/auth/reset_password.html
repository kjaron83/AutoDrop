{% extends "base.html" %}

{% block title %}{{ _("Reset Password — AutoDrop") }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 p-8 bg-slate-950 border border-slate-800 rounded-2xl shadow-xl">
    <div class="text-center space-y-2 mb-8">
        <h1 class="text-2xl font-bold text-white tracking-tight">{{ _("Set New Password") }}</h1>
        <p class="text-sm text-slate-400">{{ _("Enter a new password for your AutoDrop account.") }}</p>
    </div>

    <form method="post" action="/auth/reset-password" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}">

        <div>
            <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("New Password (min. 8 characters)") }}</label>
            <input type="password" id="password" name="password" minlength="8" required autofocus
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <div>
            <label for="confirm_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Confirm New Password") }}</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" required
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <button type="submit" class="w-full py-3 mt-4 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
            <span>🔐</span>
            <span>{{ _("Reset Password") }}</span>
        </button>
    </form>
</div>
{% endblock %}
