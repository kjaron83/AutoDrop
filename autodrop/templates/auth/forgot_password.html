{% extends "base.html" %}

{% block title %}{{ _("Forgot Password — AutoDrop") }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 p-8 bg-slate-950 border border-slate-800 rounded-2xl shadow-xl">
    <div class="text-center space-y-2 mb-8">
        <h1 class="text-2xl font-bold text-white tracking-tight">{{ _("Forgot Password?") }}</h1>
        <p class="text-sm text-slate-400">{{ _("Enter your email address to receive password reset instructions.") }}</p>
    </div>

    <form method="post" action="/auth/forgot-password" class="space-y-5">
        <div>
            <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">{{ _("Email Address") }}</label>
            <input type="email" id="email" name="email" required autofocus
                   class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
        </div>

        <button type="submit" class="w-full py-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
            <span>📩</span>
            <span>{{ _("Send Reset Link") }}</span>
        </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
        <a href="/auth/login" class="text-sm text-slate-400 hover:text-white transition">
            &larr; {{ _("Back to Sign In") }}
        </a>
    </div>
</div>
{% endblock %}
